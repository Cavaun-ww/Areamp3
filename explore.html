<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore · {site}</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="styles.css?v=3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=3"></script>
<script src="app.js?v=3"></script>
<style>
  .tools { display: grid; gap: 12px; margin-bottom: 20px; }
  .search { position: relative; }
  .search .input { padding-left: 38px; font-size: 16px; }
  .search::before { content: ">"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-family: var(--mono); color: var(--muted); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: 0 0 auto; padding: 6px 12px; border: 1px solid var(--line-2); background: none; color: var(--text-2); font-family: var(--mono); font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; border-radius: 2px; }
  .chips button.on { background: var(--text); color: #000; border-color: var(--text); }
  .bar2 { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .bar2 select { width: auto; padding: 7px 34px 7px 10px; font-size: .84rem; }
  .artists { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; scrollbar-width: none; }
  .artists a { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border: 1px solid var(--line); text-decoration: none; }
  .artists a:hover { border-color: var(--text); }
</style>
</head>
<body>
<main class="wrap wrap-wide">
  <div style="margin-bottom:16px"><div class="label">Browse</div><h1 style="font-size:1.8rem;margin-top:4px">Explore</h1></div>
  <div class="tabs" id="tabs"><button type="button" data-t="all" class="on">All music</button><button type="button" data-t="following">Following</button></div>
  <div class="tools">
    <div class="search"><input class="input" type="search" id="q" placeholder="Search songs or artists" autocomplete="off" enterkeyhint="search"></div>
    <div class="chips" id="genres"></div>
    <div class="bar2"><span class="small muted mono" id="count"></span>
      <select class="input" id="sort" aria-label="Sort">
        <option value="new">Newest</option>
        <option value="cheap">Price: low to high</option>
        <option value="free">Free downloads</option>
      </select>
    </div>
  </div>
  <div class="artists" id="artists" hidden></div>
  <div class="grid" id="list"></div>
  <div style="text-align:center;margin-top:24px"><button class="btn" id="more" hidden>Load more</button></div>
</main>

<script>
(async function () {
  App.mountHeader("explore");
  const sb = App.sb, esc = App.esc, $ = (id) => document.getElementById(id);
  const GENRES = ["All", "Hip-Hop", "R&B", "Pop", "Rock", "Electronic", "House", "Afrobeats", "Latin", "Reggae", "Jazz", "Soul", "Gospel", "Country", "Indie", "Lo-fi", "Instrumental", "Spoken Word", "Other"];
  const PAGE = 24;
  let tab = new URLSearchParams(location.search).get("tab") === "following" ? "following" : "all";
  let genre = "All", page = 0, followIds = null;
  $("genres").innerHTML = GENRES.map((g) => '<button type="button" data-g="' + esc(g) + '"' + (g === "All" ? ' class="on"' : "") + ">" + esc(g) + "</button>").join("");
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === tab));

  if (!App.configured) { $("list").innerHTML = '<div class="empty" style="grid-column:1/-1">Music shows up here once the site is connected.</div>'; return; }

  async function following() {
    if (followIds) return followIds;
    const s = await App.getSession();
    if (!s) return null;
    const { data } = await sb.from("follows").select("following").eq("follower", s.user.id);
    followIds = (data || []).map((r) => r.following);
    return followIds;
  }

  async function load(reset) {
    if (reset) { page = 0; $("list").innerHTML = '<p class="muted mono small">Loading<span class="cursor"></span></p>'; }
    const q = $("q").value.trim().replace(/[%,()]/g, " ").trim();
    let query = sb.from("tracks").select(App.TRACK_COLS, { count: "exact" }).eq("is_published", true);
    if (tab === "following") {
      const ids = await following();
      if (!ids) { $("list").innerHTML = '<div class="empty" style="grid-column:1/-1"><a href="' + App.signInUrl("explore.html?tab=following") + '">Sign in</a> to see new music from artists you follow.</div>'; $("more").hidden = true; $("count").textContent = ""; return; }
      if (!ids.length) { $("list").innerHTML = '<div class="empty" style="grid-column:1/-1">You\'re not following anyone yet. Tap + Follow on an artist\'s page.</div>'; $("more").hidden = true; $("count").textContent = ""; return; }
      query = query.in("owner", ids);
    }
    if (genre !== "All") query = query.eq("genre", genre);
    if (q) query = query.or("title.ilike.%" + q + "%,genre.ilike.%" + q + "%");
    const sort = $("sort").value;
    if (sort === "free") query = query.eq("price", 0);
    query = sort === "cheap" ? query.order("price", { ascending: true }).order("created_at", { ascending: false }) : query.order("created_at", { ascending: false });
    const { data, count, error } = await query.range(page * PAGE, page * PAGE + PAGE - 1);
    if (error) { $("list").innerHTML = '<div class="empty" style="grid-column:1/-1">' + esc(error.message) + "</div>"; return; }
    App.registerTracks(data);
    const html = data.map((t) => App.trackCard(t)).join("");
    if (reset) $("list").innerHTML = html || '<div class="empty" style="grid-column:1/-1">Nothing matches yet.</div>';
    else $("list").insertAdjacentHTML("beforeend", html);
    $("count").textContent = (count || 0) + (count === 1 ? " track" : " tracks");
    $("more").hidden = (page + 1) * PAGE >= (count || 0);
  }

  async function loadArtists() {
    const q = $("q").value.trim().replace(/[%,()]/g, " ").trim();
    if (q.length < 2) { $("artists").hidden = true; return; }
    const { data } = await sb.from("profiles").select("handle, display_name, avatar_path").not("handle", "is", null)
      .or("handle.ilike.%" + q + "%,display_name.ilike.%" + q + "%").limit(10);
    $("artists").hidden = !(data && data.length);
    $("artists").innerHTML = (data || []).map((p) =>
      '<a href="' + esc(App.profileLink(p.handle)) + '">' + App.avatarHTML(p, 34) + "<span><b>" + esc(App.artistName(p)) + '</b><br><span class="small muted mono">@' + esc(p.handle) + "</span></span></a>").join("");
  }

  let t;
  $("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { load(true); loadArtists(); }, 250); });
  $("sort").onchange = () => load(true);
  $("more").onclick = () => { page++; load(false); };
  $("genres").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    genre = b.dataset.g;
    $("genres").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    load(true);
  };
  $("tabs").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    tab = b.dataset.t;
    $("tabs").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    history.replaceState(null, "", tab === "following" ? "explore.html?tab=following" : "explore.html");
    load(true);
  };
  load(true);
})();
</script>
</body>
</html>
