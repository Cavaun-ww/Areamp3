<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore · {site}</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="styles.css?v=113">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=113"></script>
<script src="app.js?v=113"></script>
<style>
  .head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 16px; }
  .head-row .vf { display: inline-block; width: 13px; height: 13px; margin-right: 10px; vertical-align: -1px; border: 2px solid currentColor; border-radius: 2px; box-shadow: inset 0 0 0 2px var(--text), inset 0 0 0 5px currentColor; }
  .ar-wrap { max-width: 330px; }
  .create-btn { display: inline-flex; align-items: center; gap: 8px; margin: 18px 0 10px; }
  .ar-note { font-size: .82rem; color: var(--text-2); margin-top: 8px; line-height: 1.45; }
  @media (max-width: 520px) { .ar-wrap { max-width: none; width: 100%; } .head-row #ar-btn { width: 100%; justify-content: center; } .ar-note { text-align: center; } }
  .search { position: relative; margin: 18px 0 0; }
  .search .input { padding-left: 38px; font-size: 16px; }
  .search::before { content: ">"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-family: var(--mono); color: var(--muted); }

  /* library layout: filters on the left, results on the right */
  .lib { display: grid; grid-template-columns: 230px 1fr; gap: 26px; margin-top: 20px; align-items: start; }
  .side { position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow-y: auto; padding-right: 6px; scrollbar-width: thin; }
  .facet { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .facet:first-child { padding-top: 0; }
  .facet h4 { font-family: var(--mono); font-weight: 400; font-size: .76rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-2); margin-bottom: 10px; display: flex; justify-content: space-between; }
  .facet h4 button { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; padding: 0; }
  .facet h4 button:hover { color: var(--text); }
  .opt { display: flex; align-items: center; gap: 9px; padding: 4px 0; cursor: pointer; font-size: .9rem; color: var(--text-2); }
  .opt:hover { color: var(--text); }
  .opt input { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; border: 1px solid var(--line-2); border-radius: 2px; margin: 0; flex: 0 0 auto; cursor: pointer; display: grid; place-items: center; }
  .opt input:checked { background: var(--text); border-color: var(--text); }
  .opt input:checked::after { content: ""; width: 6px; height: 3px; border: solid #000; border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
  .opt span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opt em { font-style: normal; font-family: var(--mono); font-size: .76rem; color: var(--muted); }
  .opt.zero { opacity: .4; }
  .more-btn { background: none; border: 0; color: var(--text-2); font-family: var(--mono); font-size: .76rem; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; padding: 6px 0 0; text-decoration: underline; text-underline-offset: 3px; }
  /* release-year range with a little bar chart, like an archive */
  .hist { display: flex; align-items: flex-end; gap: 2px; height: 44px; margin-bottom: 8px; }
  .hist i { flex: 1; background: var(--line-2); min-height: 2px; }
  .hist i.on { background: var(--text); }
  .yr { display: flex; align-items: center; gap: 6px; }
  .yr input { width: 100%; padding: 6px 8px; font-family: var(--mono); font-size: .84rem; text-align: center; }
  .yr span { color: var(--muted); }
  /* artists matching the search (they show even before they've posted anything) */
  .people { margin-bottom: 18px; }
  .people h4 { font-family: var(--mono); font-weight: 400; font-size: .76rem; letter-spacing: .14em; text-transform: uppercase; color: var(--text-2); margin-bottom: 8px; }
  .people .row-p { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .people .row-p::-webkit-scrollbar { display: none; }
  .people a { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border: 1px solid var(--line); text-decoration: none; color: var(--text); max-width: 260px; }
  .people a:hover { border-color: var(--text); }
  .people a span { min-width: 0; }
  .people a b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .people a small { display: block; font-family: var(--mono); color: var(--muted); font-size: .76rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chips-on { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chips-on button { display: inline-flex; gap: 6px; align-items: center; padding: 4px 9px; border: 1px solid var(--text); background: none; color: var(--text); font-family: var(--mono); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; border-radius: 2px; }
  .chips-on button::after { content: "x"; color: var(--muted); }

  /* sort bar */
  .sortbar { display: flex; align-items: center; gap: 4px 18px; flex-wrap: wrap; padding: 0 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .sortbar .lbl { font-family: var(--mono); font-size: .76rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .sortbar .s { background: none; border: 0; padding: 4px 0; color: var(--text-2); font: inherit; font-size: .9rem; letter-spacing: .04em; cursor: pointer; border-bottom: 1px solid transparent; }
  .sortbar .s:hover { color: var(--text); }
  .sortbar .s.on { color: var(--text); border-bottom-color: var(--text); }
  .sortbar .s .dir { font-family: var(--mono); margin-left: 4px; }
  .sortbar .right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .sortbar .count { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
  .views { display: flex; border: 1px solid var(--line-2); border-radius: 2px; }
  .views button { width: 34px; height: 30px; background: none; border: 0; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
  .views button + button { border-left: 1px solid var(--line-2); }
  .views button.on { background: var(--text); color: #000; }
  .views svg { width: 15px; height: 15px; }
  #filters-btn, #sort-sel { display: none; }
  #sort-sel { width: auto; padding: 7px 30px 7px 10px; font-size: .86rem; }

  /* archive-style tiles */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(170px, 44vw), 1fr)); gap: 12px; }
  .tile { background: var(--card); border: 1px solid var(--line); display: flex; flex-direction: column; transition: border-color .15s; min-width: 0; }
  .tile:hover { border-color: var(--text-2); }
  .tile { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .tile .cov .hide-badge { pointer-events: none; }
  .stats { color: inherit; text-decoration: none; }
  .tile .cov { position: relative; aspect-ratio: 1; overflow: hidden; background: #050505; margin: 8px 8px 0; }
  .tile .cov img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .cov .pbtn { position: absolute; right: 8px; bottom: 8px; width: 38px; height: 38px; }
  .tile .cov .hide-badge { font-size: .64rem; padding: 5px 8px; }
  .tile .info { padding: 10px 10px 8px; flex: 1; min-width: 0; }
  .tile .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text); text-decoration: none; font-weight: 600; font-size: .92rem; line-height: 1.3; overflow-wrap: anywhere; }
  .tile .a { display: block; color: var(--text-2); text-decoration: none; font-size: .82rem; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .a:hover, .tile .t:hover { text-decoration: underline; }
  .stats { display: grid; grid-template-columns: auto 1fr 1fr 1fr; align-items: center; border-top: 1px solid var(--line); padding: 7px 10px; gap: 6px; }
  .stats .ty { justify-self: start; }
  .stats .ty { font-family: var(--mono); font-size: .66rem; letter-spacing: .06em; padding: 3px 5px; background: var(--text); color: #000; border-radius: 2px; }
  .stats .n { display: flex; flex-direction: column; align-items: center; gap: 1px; font-family: var(--mono); font-size: .72rem; color: var(--text-2); }
  .stats .n svg { width: 13px; height: 13px; color: var(--muted); }
  .stats .n b { font-weight: 400; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* list view */
  .tiles.list { grid-template-columns: 1fr; gap: 0; border-top: 1px solid var(--line); }
  .tiles.list .tile { flex-direction: row; align-items: center; border-width: 0 0 1px; background: none; }
  .tiles.list .tile .cov { width: 64px; flex: 0 0 64px; margin: 8px; }
  .tiles.list .tile .cov .pbtn { width: 30px; height: 30px; right: 4px; bottom: 4px; }
  .tiles.list .tile .cov .hide-badge { display: none; }
  /* list view: the thumbnail is too small for the copies badge, so it moves next to the title */
  .tile .ed-row { display: none; }
  .tiles.list .tile .cov .ed { display: none; }
  .tiles.list .tile .ed-row { display: block; margin: 4px 0 2px; }
  .tiles.list .tile .ed-row .ed { position: static; max-width: 100%; font-size: .56rem; letter-spacing: .08em; padding: 2px 6px; }
  .tiles.list .tile .info { padding: 8px 6px; }
  .tiles.list .stats { border: 0; grid-template-columns: 50px repeat(3, 60px); padding: 0 12px; }
  .tiles.list .extra { display: block; }
  .tile .loc { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: .7rem; color: var(--text-2); margin-top: 4px; letter-spacing: .04em; min-width: 0; }
  .tile .loc svg { width: 12px; height: 12px; flex-shrink: 0; }
  .tile .loc span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tile .cov .pin-badge { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; display: grid; place-items: center; background: rgba(0,0,0,.66); border: 1px solid rgba(255,255,255,.28); border-radius: 50%; color: #f4f4f4; pointer-events: none; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .tile .cov .pin-badge svg { width: 14px; height: 14px; }
  .extra { display: none; font-family: var(--mono); font-size: .74rem; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  @media (max-width: 860px) {
    .lib { grid-template-columns: 1fr; gap: 0; }
    .side { position: static; max-height: none; display: none; border: 1px solid var(--line); padding: 14px; margin-bottom: 16px; }
    .side.open { display: block; }
    #filters-btn { display: inline-flex; }
    #sort-sel { display: block; }
    .sortbar .s, .sortbar .lbl { display: none; }
    .sortbar { gap: 10px; flex-wrap: wrap; }
    #sort-sel { order: 5; flex: 1 1 100%; width: 100%; }
    .sortbar .count { display: none; }
    .tiles.list .stats { grid-template-columns: 44px 34px 58px; gap: 4px; padding: 0 8px; }
    .tiles.list .stats .n.c { display: none; }
  }
</style>
</head>
<body>
<main class="wrap wrap-wide">
  <div class="head-row"><div><div class="label">Browse</div><h1 style="font-size:1.8rem;margin-top:4px">Explore</h1></div><div class="ar-wrap"><a class="btn btn-primary" href="ar.html?explore=1&go=1" id="ar-btn"><span class="vf" aria-hidden="true"></span>Open AR camera</a><p class="ar-note">Point your phone at any Area MP3 image out in the world to watch and hear it, and unlock hidden drops.</p></div></div>
  <a class="btn btn-sm create-btn" href="upload.html"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 5v14M5 12h14"/></svg>Create</a>
  <div class="tabs" id="tabs"><button type="button" data-t="all" class="on">All music</button><button type="button" data-t="following">Following</button></div>
  <div class="search"><input class="input" type="search" id="q" placeholder="Search songs, artists, genres or places" autocomplete="off" enterkeyhint="search"></div>

  <div class="lib">
    <aside class="side" id="side" aria-label="Filters"></aside>
    <section>
      <div class="sortbar">
        <button class="btn btn-sm" type="button" id="filters-btn">Filters</button>
        <button class="btn btn-sm" type="button" id="near">Near me</button>
        <select class="input" id="sort-sel" aria-label="Sort by">
          <option value="date:-1">Newest</option><option value="date:1">Oldest</option><option value="likes:-1">Most liked</option><option value="comments:-1">Most comments</option>
          <option value="title:1">Title A–Z</option><option value="artist:1">Artist A–Z</option>
        </select>
        <span class="lbl">Sort by</span>
        <button class="s" data-s="date">Date published</button>
        <button class="s" data-s="likes">Most liked</button>
        <button class="s" data-s="comments">Most comments</button>
        <button class="s" data-s="title">Title</button>
        <button class="s" data-s="artist">Artist</button>
        <div class="right">
          <span class="count" id="count"></span>
          <div class="views" role="group" aria-label="View">
            <button type="button" data-v="grid" title="Grid"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6"/><rect x="9" y="1" width="6" height="6"/><rect x="1" y="9" width="6" height="6"/><rect x="9" y="9" width="6" height="6"/></svg></button>
            <button type="button" data-v="list" title="List"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="2" width="3" height="3"/><rect x="6" y="2.5" width="9" height="2"/><rect x="1" y="7" width="3" height="3"/><rect x="6" y="7.5" width="9" height="2"/><rect x="1" y="12" width="3" height="3"/><rect x="6" y="12.5" width="9" height="2"/></svg></button>
          </div>
        </div>
      </div>
      <div class="people" id="people" hidden></div>
      <div class="chips-on" id="on"></div>
      <div class="tiles" id="list"><p class="muted mono small">Loading<span class="cursor"></span></p></div>
      <div style="text-align:center;margin-top:24px"><button class="btn" id="more" hidden>Load more</button></div>
    </section>
  </div>
</main>

<script>
(async function () {
  App.mountHeader("explore");
  const sb = App.sb, esc = App.esc, $ = (id) => document.getElementById(id);
  const PAGE = 48, MAX = 2000;
  const ICON = {
    heart: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 14s-5.5-3.4-5.5-7.2A3 3 0 0 1 8 4.6a3 3 0 0 1 5.5 2.2C13.5 10.6 8 14 8 14z"/></svg>',
    chat: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3h12v8H6l-3 3v-3H2z"/></svg>',
    tag: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2h6l6 6-6 6-6-6z"/><circle cx="5.5" cy="5.5" r="1"/></svg>',
    pin: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 15s-4.8-5-4.8-8.4a4.8 4.8 0 0 1 9.6 0C12.8 10 8 15 8 15z"/><circle cx="8" cy="6.6" r="1.7"/></svg>',
  };
  const qs = new URLSearchParams(location.search);
  let tab = qs.get("tab") === "following" ? "following" : "all";
  let all = [], followIds = null, shown = 0, rows = [];
  let sort = "date", dir = -1;   // -1 = high to low / newest first
  let view = "grid";
  try { view = localStorage.getItem("am-view") === "list" ? "list" : "grid"; } catch (e) {}
  const sel = { type: new Set(), format: new Set(), genre: new Set(), artist: new Set() };
  let yFrom = null, yTo = null, artistsOpen = false, genresOpen = false;
  let here = null; // Near me: closest drops with a location first (same as Pixi Wizard)

  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === tab));
  if (!App.configured) { $("list").innerHTML = '<div class="empty" style="grid-column:1/-1">Music shows up here once the site is connected.</div>'; return; }

  // load every public song once; filtering, counting and sorting happen right here on the page
  const { data, error } = await sb.from("tracks").select(App.TRACK_COLS).eq("is_published", true).eq("is_private", false).order("created_at", { ascending: false }).limit(MAX);
  if (error) { $("list").innerHTML = '<div class="empty" style="grid-column:1/-1">' + esc(error.message) + "</div>"; return; }
  all = data || [];
  App.registerTracks(all);
  const year = (t) => new Date(t.created_at).getFullYear();
  // what a listener can download: the song's format and/or "video"
  // what's in a drop: its audio (MP3/WAV) and what appears over the art (video, GIF, photo or 3D model)
  const fmts = (t) => {
    const f = App.hasSong(t) ? [t.audio_format || "mp3"] : [], p = (t.video_path || "").toLowerCase();
    if (App.hasVid(t) || /\.(mp4|webm|mov|m4v)$/.test(p)) f.push("video");
    else if (/\.gif$/.test(p)) f.push("gif");
    else if (/\.(jpe?g|png|webp)$/.test(p)) f.push("photo");
    else if (/\.glb$/.test(p)) f.push("3d");
    return f;
  };
  const FMT_NAMES = { mp3: "MP3 audio", wav: "WAV audio", video: "Video", gif: "GIF", photo: "Photo", "3d": "3D model" };
  // a drop can be more than one type: e.g. a blurred song for $1.29 is both "For sale" and "Find it in person"
  const typesOf = (t) => {
    const k = [], lock = t.song_lock || "none";
    if (lock === "listen") {} // listen-only: neither free download nor for sale
    else if (lock === "buy" ? +t.price > 0 : lock === "free" ? false : +t.price > 0) k.push("sale");
    else k.push("free");
    if (App.isLocked(t) || t.photo_hidden) k.push("find");
    if (t.max_copies != null) k.push("limited");
    if (t.is_album) k.push("album");
    return k;
  };
  const TYPE_NAMES = { free: "Free download", sale: "For sale", find: "Find it in person", limited: "Limited copies", album: "Albums" };
  const artistKey = (t) => (t.profiles && t.profiles.handle) || "";
  const artistLabel = (t) => App.artistName(t.profiles);
  const years = all.map(year);
  const minY = years.length ? Math.min(...years) : new Date().getFullYear(), maxY = years.length ? Math.max(...years) : minY;

  async function following() {
    if (followIds) return followIds;
    const s = await App.getSession();
    if (!s) return null;
    const { data } = await sb.from("follows").select("following").eq("follower", s.user.id);
    followIds = new Set((data || []).map((r) => r.following));
    return followIds;
  }

  // does a song pass every filter except the one named (so each list shows useful counts)
  function passes(t, skip, q, fol) {
    if (fol && !fol.has(t.owner)) return false;
    if (q) {
      const hay = (t.title + " " + (t.genre || "") + " " + artistLabel(t) + " " + artistKey(t) + " " + (t.description || "") + " " + (t.place_name || "") + " " + (t.place_area || "")).toLowerCase();
      if (!q.split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    if (skip !== "type" && sel.type.size && ![...sel.type].some((k) => typesOf(t).includes(k))) return false;
    if (skip !== "format" && sel.format.size && !fmts(t).some((f) => sel.format.has(f))) return false;
    if (skip !== "genre" && sel.genre.size && !sel.genre.has(t.genre || "Other")) return false;
    if (skip !== "artist" && sel.artist.size && !sel.artist.has(artistKey(t))) return false;
    if (skip !== "year") { const y = year(t); if ((yFrom && y < yFrom) || (yTo && y > yTo)) return false; }
    return true;
  }

  function counts(key, fn, q, fol) {
    const m = new Map();
    all.forEach((t) => { if (passes(t, key, q, fol)) { const k = fn(t); m.set(k, (m.get(k) || 0) + 1); } });
    return m;
  }

  function optHTML(group, value, label, n) {
    const on = sel[group].has(value);
    return '<label class="opt' + (n || on ? "" : " zero") + '"><input type="checkbox" data-g="' + group + '" value="' + esc(value) + '"' + (on ? " checked" : "") + "><span>" + esc(label) + "</span><em>" + n.toLocaleString() + "</em></label>";
  }

  function drawSide(q, fol) {
    const anyOn = Object.values(sel).some((s) => s.size) || yFrom || yTo;
    let h = "";
    // release year: bar chart + range
    const yc = counts("year", year, q, fol), span = [];
    for (let y = minY; y <= maxY; y++) span.push(y);
    const top = Math.max(1, ...span.map((y) => yc.get(y) || 0));
    h += '<div class="facet"><h4>Year published' + (anyOn ? '<button type="button" id="clear">Clear all</button>' : "") + "</h4>" +
      (span.length > 1 ? '<div class="hist">' + span.map((y) => '<i title="' + y + ": " + (yc.get(y) || 0) + '" class="' + ((!yFrom || y >= yFrom) && (!yTo || y <= yTo) ? "on" : "") + '" style="height:' + Math.round(((yc.get(y) || 0) / top) * 100) + '%"></i>').join("") + "</div>" : "") +
      '<div class="yr"><input class="input" type="number" id="y1" inputmode="numeric" min="' + minY + '" max="' + maxY + '" value="' + (yFrom || minY) + '" aria-label="From year"><span>–</span><input class="input" type="number" id="y2" inputmode="numeric" min="' + minY + '" max="' + maxY + '" value="' + (yTo || maxY) + '" aria-label="To year"></div></div>';
    // type
    const tc = new Map();
    all.forEach((t) => { if (passes(t, "type", q, fol)) typesOf(t).forEach((k) => tc.set(k, (tc.get(k) || 0) + 1)); });
    const nLim = tc.get("limited") || 0;
    h += '<div class="facet"><h4>Type</h4>' + ["free", "sale", "find"].map((k) => optHTML("type", k, TYPE_NAMES[k], tc.get(k) || 0)).join("") +
      (nLim || sel.type.has("limited") ? optHTML("type", "limited", TYPE_NAMES.limited, nLim) : "") +
      ((tc.get("album") || sel.type.has("album")) ? optHTML("type", "album", TYPE_NAMES.album, tc.get("album") || 0) : "") + "</div>";
    // format
    const fc = new Map();
    all.forEach((t) => { if (passes(t, "format", q, fol)) fmts(t).forEach((f) => fc.set(f, (fc.get(f) || 0) + 1)); });
    h += '<div class="facet"><h4>Media type</h4>' + ["mp3", "wav", "video", "gif", "photo", "3d"].map((k) => optHTML("format", k, FMT_NAMES[k], fc.get(k) || 0)).join("") + "</div>";
    // no genre or artist lists here: the search box finds both
    const names = {}; all.forEach((t) => (names[artistKey(t)] = artistLabel(t)));
    $("side").innerHTML = h;
    // chips for what's turned on
    const chips = [];
    if (yFrom || yTo) chips.push('<button type="button" data-clear="year">' + (yFrom || minY) + "–" + (yTo || maxY) + "</button>");
    ["type", "format", "genre", "artist"].forEach((g) => sel[g].forEach((v) => chips.push('<button type="button" data-clear="' + g + '" data-v="' + esc(v) + '">' + esc(g === "type" ? TYPE_NAMES[v] : g === "format" ? FMT_NAMES[v] || v.toUpperCase() : g === "artist" ? names[v] || v : v) + "</button>")));
    $("on").innerHTML = chips.join("");
    $("filters-btn").textContent = "Filters" + (chips.length ? " (" + chips.length + ")" : "");
  }

  function tileHTML(t) {
    const p = t.profiles || {};
    const link = esc(App.trackLink(t.slug));
    // always say what it costs: FREE, the price, or LISTEN (listen-only drops)
    const priceTxt = App.isLocked(t)
      ? (t.song_lock === "free" ? "FREE" : t.song_lock === "listen" ? "LISTEN" : (+t.price > 0 ? App.priceLabel(t) : "FREE"))
      : (+t.price > 0 ? App.priceLabel(t) : "FREE");
    return '<div class="tile" data-href="' + link + '">' +
      '<div class="cov"><a href="' + link + '"><img loading="lazy" alt=""' + (t.photo_hidden ? ' class="blurred"' : App.depthAttr(t)) + ' src="' + esc(App.publicUrl(t.cover_path)) + '"></a>' +
        (t.photo_hidden ? '<span class="hide-badge">FIND IT IN PERSON</span>' : "") +
        (t.has_location ? '<span class="pin-badge" title="Has a location">' + ICON.pin + "</span>" : "") + App.copiesBadge(t) + "</div>" + // music only plays in the AR camera
      '<div class="info"><a class="t" href="' + link + '">' + esc(t.title) + "</a>" +
        (App.copiesInfo(t) ? '<div class="ed-row">' + App.copiesBadge(t) + "</div>" : "") +
        (p.handle ? '<a class="a" href="' + esc(App.profileLink(p.handle)) + '">' + esc(artistLabel(t)) + App.vBadge(p) + "</a>" : "") +
        (t.has_location ? '<div class="loc">' + ICON.pin + "<span>" + esc([t.place_name || t.place_area, here && t.area_lat != null ? App.distLabel(App.milesBetween(here, { lat: t.area_lat, lng: t.area_lng })) : ""].filter(Boolean).join(" · ").toUpperCase() || "ON THE MAP") + "</span></div>" : "") +
        '<div class="extra">' + esc([t.genre, t.duration ? App.fmtTime(t.duration) : "", new Date(t.created_at).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" })].filter(Boolean).join(" · ")) + "</div></div>" +
      '<a class="stats" href="' + link + '" aria-label="Open ' + esc(t.title) + '"><span class="ty">' + esc(t.is_album ? "ALBUM" : !App.hasSong(t) ? "VIDEO" : App.hasVid(t) ? App.songType(t) + "+VID" : App.songType(t)) + "</span>" +
        '<span class="n" title="Likes">' + ICON.heart + "<b>" + App.nLikes(t) + "</b></span>" +
        '<span class="n c" title="Comments">' + ICON.chat + "<b>" + App.nComments(t) + "</b></span>" +
        '<span class="n p" title="Price">' + ICON.tag + "<b>" + esc(priceTxt) + "</b></span></a>" +
    "</div>";
  }

  // tap anywhere on a card (bottom bar, badge, empty space) → open the song page
  $("list").addEventListener("click", (e) => {
    if (e.target.closest("a, button, input, select, label")) return;
    const tile = e.target.closest(".tile[data-href]"); if (!tile) return;
    location.href = tile.dataset.href;
  });

  const cmp = {
    date: (a, b) => new Date(a.created_at) - new Date(b.created_at),
    likes: (a, b) => App.nLikes(a) - App.nLikes(b) || new Date(a.created_at) - new Date(b.created_at),
    comments: (a, b) => App.nComments(a) - App.nComments(b) || new Date(a.created_at) - new Date(b.created_at),
    title: (a, b) => a.title.localeCompare(b.title),
    artist: (a, b) => artistLabel(a).localeCompare(artistLabel(b)) || a.title.localeCompare(b.title),
    price: (a, b) => (+a.price || 0) - (+b.price || 0),
  };

  async function render() {
    const q = artistsOnly ? "" : $("q").value.trim().toLowerCase(); // signed out: song list isn't searched
    let fol = null;
    if (tab === "following") {
      fol = await following();
      if (!fol) { $("side").innerHTML = ""; $("on").innerHTML = ""; $("count").textContent = ""; $("more").hidden = true; $("list").innerHTML = '<div class="empty" style="grid-column:1/-1"><a href="' + App.signInUrl("explore.html?tab=following") + '">Sign in</a> to see new music from artists you follow.</div>'; return; }
      if (!fol.size) { $("side").innerHTML = ""; $("on").innerHTML = ""; $("count").textContent = ""; $("more").hidden = true; $("list").innerHTML = '<div class="empty" style="grid-column:1/-1">You\'re not following anyone yet. Tap + Follow on an artist\'s page.</div>'; return; }
    }
    drawSide(q, fol);
    rows = all.filter((t) => passes(t, null, q, fol));
    if (here) rows = rows.filter((t) => t.area_lat != null).sort((a, b) => App.milesBetween(here, { lat: a.area_lat, lng: a.area_lng }) - App.milesBetween(here, { lat: b.area_lat, lng: b.area_lng }));
    else rows.sort((a, b) => cmp[sort](a, b) * dir);
    document.querySelectorAll(".sortbar .s").forEach((b) => {
      b.classList.toggle("on", b.dataset.s === sort);
      b.innerHTML = b.textContent.replace(/[↑↓]/g, "").trim() + (b.dataset.s === sort ? '<span class="dir">' + (dir < 0 ? "↓" : "↑") + "</span>" : "");
    });
    document.querySelectorAll(".views button").forEach((b) => b.classList.toggle("on", b.dataset.v === view));
    const sv = sort + ":" + dir; if ([...$("sort-sel").options].some((o) => o.value === sv)) $("sort-sel").value = sv;
    $("list").classList.toggle("list", view === "list");
    $("count").textContent = rows.length.toLocaleString() + (here ? " near you" : rows.length === 1 ? " result" : " results");
    shown = 0; $("list").innerHTML = "";
    if (!rows.length) { $("list").innerHTML = '<div class="empty" style="grid-column:1/-1">' + (all.length || q ? "" + (here ? "No drops with a location match yet." : "Nothing matches. Try fewer filters.") + "" : 'No music yet. <a href="upload.html">Be the first →</a>') + "</div>"; $("more").hidden = true; return; }
    more();
  }
  function more() {
    $("list").insertAdjacentHTML("beforeend", rows.slice(shown, shown + PAGE).map(tileHTML).join(""));
    shown += PAGE;
    $("more").hidden = shown >= rows.length;
  }

  // ── controls ──
  $("side").addEventListener("change", (e) => {
    const c = e.target;
    if (c.dataset.g) { c.checked ? sel[c.dataset.g].add(c.value) : sel[c.dataset.g].delete(c.value); render(); }
    if (c.id === "y1" || c.id === "y2") {
      let a = parseInt($("y1").value, 10), b = parseInt($("y2").value, 10);
      if (a > b) [a, b] = [b, a];
      yFrom = a > minY ? a : null; yTo = b < maxY ? b : null; render();
    }
  });
  $("side").addEventListener("click", (e) => {
    if (e.target.id === "a-more") { artistsOpen = !artistsOpen; render(); }
    if (e.target.id === "g-more") { genresOpen = !genresOpen; render(); }
    if (e.target.id === "clear") { Object.values(sel).forEach((s) => s.clear()); yFrom = yTo = null; render(); }
  });
  $("on").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.clear === "year") yFrom = yTo = null; else sel[b.dataset.clear].delete(b.dataset.v);
    render();
  });
  document.querySelectorAll(".sortbar .s").forEach((b) => (b.onclick = () => {
    const s = b.dataset.s;
    if (sort === s) dir = -dir; else { sort = s; dir = s === "title" || s === "artist" || s === "price" ? 1 : -1; }
    render();
  }));
  document.querySelectorAll(".views button").forEach((b) => (b.onclick = () => {
    view = b.dataset.v; try { localStorage.setItem("am-view", view); } catch (e) {}
    render();
  }));
  $("sort-sel").onchange = () => { const [s2, d2] = $("sort-sel").value.split(":"); sort = s2; dir = +d2; render(); };
  $("near").onclick = async () => {
    if (here) { here = null; $("near").classList.remove("btn-primary"); $("near").textContent = "Near me"; return render(); }
    $("near").disabled = true; $("near").textContent = "Finding you…";
    try { here = await App.hereNow(); $("near").classList.add("btn-primary"); $("near").textContent = "Near me ✕"; }
    catch (e) { App.toast(/denied|blocked/i.test(e.message) ? "Location is off for this site. Turn it on in your phone's settings to use Near me." : e.message, true); $("near").textContent = "Near me"; }
    $("near").disabled = false;
    render();
  };
  $("filters-btn").onclick = () => $("side").classList.toggle("open");
  let tm;
  // signed out: the search box finds artists only (songs, genres and places need an account)
  let artistsOnly = false;
  App.getSession().then((s) => {
    if (s) return;
    artistsOnly = true;
    $("q").placeholder = "Search artists · sign in to search songs and places";
  });
  $("q").addEventListener("input", () => { clearTimeout(tm); tm = setTimeout(() => { render(); loadPeople(); }, 200); });

  // artists whose name or @handle matches the search
  let peopleRun = 0;
  async function loadPeople() {
    const q = $("q").value.trim().replace(/[%,()*\\:"]/g, " ").trim().slice(0, 60);
    const run = ++peopleRun;
    if (q.length < 2) { $("people").hidden = true; $("people").innerHTML = ""; return; }
    const { data } = await sb.from("profiles").select("id, handle, display_name, avatar_path, verified").not("handle", "is", null)
      .or("handle.ilike.*" + q + "*,display_name.ilike.*" + q + "*").limit(20);
    if (run !== peopleRun) return;
    const list = data || [];
    const drops = {}; all.forEach((t) => (drops[t.owner] = (drops[t.owner] || 0) + 1));
    $("people").hidden = !list.length;
    $("people").innerHTML = list.length ? "<h4>Artists</h4><div class=\"row-p\">" + list.map((p) =>
      '<a href="' + esc(App.profileLink(p.handle)) + '">' + App.avatarHTML(p, 36) + "<span><b>" + esc(App.artistName(p)) + App.vBadge(p) + "</b><small>@" + esc(p.handle) + " · " + (drops[p.id] || 0) + ((drops[p.id] || 0) === 1 ? " drop" : " drops") + "</small></span></a>").join("") + "</div>" : "";
    if (artistsOnly && q.length >= 2 && !list.length) { $("people").hidden = false; $("people").innerHTML = '<p class="muted small">No artists match “' + esc(q) + '”. <a href="' + esc(App.signInUrl("explore.html")) + '">Sign in</a> to search songs and places too.</p>'; }
    if (list.length && !rows.length) $("list").innerHTML = '<div class="empty" style="grid-column:1/-1">No songs match yet. Tap the artist above to see their page.</div>';
  }
  $("more").onclick = more;
  $("tabs").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    tab = b.dataset.t;
    $("tabs").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    history.replaceState(null, "", tab === "all" ? "explore.html" : "explore.html?tab=" + tab);
    render();
  };
  render();
})();
</script>
</body>
</html>
